# Semantic layer implemented from glossary/metrics.yaml. Metric descriptions are copied
# verbatim from the glossary; tests/test_semantic_layer.py fails if they drift apart.
version: 2

models:
  - name: metricflow_time_spine
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day

semantic_models:
  - name: order_lines
    description: One row per order line (lineitem joined to its order).
    model: ref('fct_order_lines')
    defaults:
      agg_time_dimension: order_date
    entities:
      - name: order_line
        type: primary
        expr: order_line_id
      - name: order
        type: foreign
        expr: order_key
      - name: customer
        type: foreign
        expr: customer_key
      - name: part
        type: foreign
        expr: part_key
      - name: supplier
        type: foreign
        expr: supplier_key
    dimensions:
      - name: order_date
        description: Date the order was placed. The reference date for every metric (metric_time).
        type: time
        type_params:
          time_granularity: day
      - name: ship_date
        description: Date the order line was shipped.
        type: time
        type_params:
          time_granularity: day
      - name: ship_mode
        description: Shipping mode of the line (AIR, FOB, MAIL, RAIL, REG AIR, SHIP, TRUCK).
        type: categorical
      - name: return_flag
        description: R = returned, A = accepted, N = not yet delivered.
        type: categorical
      - name: line_status
        description: F = fulfilled, O = open.
        type: categorical
      - name: order_priority
        description: Order priority (1-URGENT to 5-LOW).
        type: categorical
      - name: order_status
        description: F = fully fulfilled, O = open, P = partially fulfilled.
        type: categorical
    measures:
      - name: gross_revenue_m
        agg: sum
        expr: extended_price
      - name: discounted_revenue_all_m
        agg: sum
        expr: extended_price * (1 - discount)
      - name: net_revenue_m
        agg: sum
        expr: case when return_flag <> 'R' then extended_price * (1 - discount) else 0 end
      - name: returned_revenue_m
        agg: sum
        expr: case when return_flag = 'R' then extended_price * (1 - discount) else 0 end
      - name: discount_amount_m
        agg: sum
        expr: extended_price * discount
      - name: average_discount_m
        agg: average
        expr: discount
      - name: billed_amount_m
        agg: sum
        expr: extended_price * (1 - discount) * (1 + tax)
      - name: units_ordered_m
        agg: sum
        expr: quantity
      - name: order_line_count_m
        agg: sum
        expr: "1"
      - name: late_lines_m
        agg: sum
        expr: is_late
      - name: order_count_m
        agg: count_distinct
        expr: order_key
      - name: active_customers_m
        agg: count_distinct
        expr: customer_key

  - name: customers
    description: Customers with their nation and region.
    model: ref('dim_customers')
    entities:
      - name: customer
        type: primary
        expr: customer_key
    dimensions:
      - name: name
        description: Customer name.
        type: categorical
      - name: market_segment
        description: Customer market segment (AUTOMOBILE, BUILDING, FURNITURE, HOUSEHOLD, MACHINERY).
        type: categorical
      - name: nation
        description: Nation of the customer.
        type: categorical
      - name: region
        description: Region of the customer's nation.
        type: categorical

  - name: suppliers
    description: Suppliers with their nation and region.
    model: ref('dim_suppliers')
    entities:
      - name: supplier
        type: primary
        expr: supplier_key
    dimensions:
      - name: name
        description: Supplier name.
        type: categorical
      - name: nation
        description: Nation of the supplier.
        type: categorical
      - name: region
        description: Region of the supplier's nation.
        type: categorical

  - name: parts
    description: Part catalogue attributes.
    model: ref('dim_parts')
    entities:
      - name: part
        type: primary
        expr: part_key
    dimensions:
      - name: brand
        description: Part brand, e.g. Brand#13.
        type: categorical
      - name: manufacturer
        description: Part manufacturer, e.g. Manufacturer#1.
        type: categorical
      - name: part_type
        description: Part type, e.g. ECONOMY ANODIZED STEEL.
        type: categorical
      - name: size
        description: Part size (integer 1-50).
        type: categorical
      - name: container
        description: Part container, e.g. SM CASE.
        type: categorical

metrics:
  - name: gross_revenue
    label: Gross revenue
    description: List-price value of all order lines before discounts, including returned lines.
    type: simple
    type_params: {measure: gross_revenue_m}
  - name: net_revenue
    label: Net revenue
    description: Revenue after discounts, EXCLUDING returned lines. This is the company's official revenue figure.
    type: simple
    type_params: {measure: net_revenue_m}
  - name: returned_revenue
    label: Returned revenue
    description: Discounted value of returned lines.
    type: simple
    type_params: {measure: returned_revenue_m}
  - name: discounted_revenue_all
    label: Discounted revenue (all lines)
    description: Internal building block for return_rate.
    type: simple
    type_params: {measure: discounted_revenue_all_m}
  - name: return_rate
    label: Return rate
    description: Share of discounted revenue that was returned (fraction 0-1).
    type: ratio
    type_params:
      numerator: returned_revenue
      denominator: discounted_revenue_all
  - name: discount_amount
    label: Discount amount
    description: Money given away in discounts, all order lines including returned ones.
    type: simple
    type_params: {measure: discount_amount_m}
  - name: average_discount
    label: Average discount
    description: Simple average of the discount rate per order line (fraction 0-1), all lines.
    type: simple
    type_params: {measure: average_discount_m}
  - name: billed_amount
    label: Billed amount
    description: What was invoiced, discounted price plus tax, all order lines including returned ones.
    type: simple
    type_params: {measure: billed_amount_m}
  - name: units_ordered
    label: Units ordered
    description: Quantity of units on order lines, all lines including returned ones.
    type: simple
    type_params: {measure: units_ordered_m}
  - name: order_line_count
    label: Order lines
    description: Number of order lines.
    type: simple
    type_params: {measure: order_line_count_m}
  - name: late_lines
    label: Late lines
    description: Internal building block for late_line_rate.
    type: simple
    type_params: {measure: late_lines_m}
  - name: order_count
    label: Orders
    description: Number of distinct orders with at least one line in the slice.
    type: simple
    type_params: {measure: order_count_m}
  - name: active_customers
    label: Active customers
    description: Number of distinct customers with at least one order in the slice.
    type: simple
    type_params: {measure: active_customers_m}
  - name: average_order_value
    label: Average order value
    description: Net revenue divided by the number of orders (all orders count in the denominator).
    type: ratio
    type_params:
      numerator: net_revenue
      denominator: order_count
  - name: late_line_rate
    label: Late line rate
    description: Share of order lines received after the committed date (fraction 0-1).
    type: ratio
    type_params:
      numerator: late_lines
      denominator: order_line_count
  - name: net_revenue_yoy_growth
    label: Net revenue YoY growth
    description: Net revenue growth against the same period one year earlier, as a fraction (0.05 = +5%). Requires a time grouping by order date.
    type: derived
    type_params:
      expr: (net_revenue - net_revenue_prev_year) / net_revenue_prev_year
      metrics:
        - name: net_revenue
        - name: net_revenue
          offset_window: 1 year
          alias: net_revenue_prev_year
