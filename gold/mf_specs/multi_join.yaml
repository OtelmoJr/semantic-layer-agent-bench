  - '{{ Dimension(''order_line__return_flag'') }} <> ''R'''
  - '{{ TimeDimension(''metric_time'', ''day'') }} >= ''1996-01-01'''
  - '{{ TimeDimension(''metric_time'', ''day'') }} < ''1997-01-01'''
