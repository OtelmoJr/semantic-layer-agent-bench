- id: tim009
  category: time
  coverage: in
  question: "What was the return rate in each month of 1994?"
  order_matters: false
  reference_sql: |
    SELECT CAST(date_trunc('month', o.o_orderdate) AS DATE) AS order_month,
           SUM(CASE WHEN l.l_returnflag = 'R' THEN l.l_extendedprice * (1 - l.l_discount) ELSE 0 END)
             / SUM(l.l_extendedprice * (1 - l.l_discount)) AS return_rate
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    WHERE o.o_orderdate >= DATE '1994-01-01' AND o.o_orderdate < DATE '1995-01-01'
    GROUP BY 1

- id: tim010
  category: time
  coverage: in
  question: "Track the late line rate by quarter across 1995 and 1996."
  order_matters: false
  reference_sql: |
    SELECT CAST(date_trunc('quarter', o.o_orderdate) AS DATE) AS order_quarter,
           AVG(CASE WHEN l.l_receiptdate > l.l_commitdate THEN 1.0 ELSE 0.0 END) AS late_line_rate
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    WHERE o.o_orderdate >= DATE '1995-01-01' AND o.o_orderdate < DATE '1997-01-01'
    GROUP BY 1

- id: tim011
  category: time
  coverage: in
  question: "What was the average order value in each year from 1992 through 1998?"
  order_matters: false
  reference_sql: |
    SELECT CAST(date_trunc('year', o.o_orderdate) AS DATE) AS order_year,
           SUM(CASE WHEN l.l_returnflag <> 'R' THEN l.l_extendedprice * (1 - l.l_discount) ELSE 0 END)
             / COUNT(DISTINCT l.l_orderkey) AS average_order_value
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    WHERE o.o_orderdate >= DATE '1992-01-01' AND o.o_orderdate < DATE '1999-01-01'
    GROUP BY 1

- id: tim012
  category: time
  coverage: in
  question: "Monthly billed amount for the first half of 1997, please."
  order_matters: false
  reference_sql: |
    SELECT CAST(date_trunc('month', o.o_orderdate) AS DATE) AS order_month,
           SUM(l.l_extendedprice * (1 - l.l_discount) * (1 + l.l_tax)) AS billed_amount
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    WHERE o.o_orderdate >= DATE '1997-01-01' AND o.o_orderdate < DATE '1997-07-01'
    GROUP BY 1

