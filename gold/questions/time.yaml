- id: tim001
  category: time
  coverage: in
  question: "Show net revenue for each month of 1995."
  order_matters: false
  reference_sql: |
    SELECT CAST(date_trunc('month', o.o_orderdate) AS DATE) AS order_month,
           SUM(l.l_extendedprice * (1 - l.l_discount)) AS net_revenue
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    WHERE l.l_returnflag <> 'R'
      AND o.o_orderdate >= DATE '1995-01-01' AND o.o_orderdate < DATE '1996-01-01'
    GROUP BY 1

