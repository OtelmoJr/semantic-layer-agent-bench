- id: tim018
  category: time
  coverage: in
  question: "What was year-over-year net revenue growth for each year from 1993 to 1997?"
  order_matters: false
  reference_sql: |
    WITH yearly AS (
      SELECT CAST(date_trunc('year', o.o_orderdate) AS DATE) AS order_year,
             SUM(l.l_extendedprice * (1 - l.l_discount)) AS net_revenue
      FROM lineitem l
      JOIN orders o ON o.o_orderkey = l.l_orderkey
      WHERE l.l_returnflag <> 'R'
      GROUP BY 1
    )
    SELECT cur.order_year,
           (cur.net_revenue - prev.net_revenue) / prev.net_revenue AS net_revenue_yoy_growth
    FROM yearly cur
    JOIN yearly prev ON prev.order_year = CAST(cur.order_year - INTERVAL 1 YEAR AS DATE)
    WHERE cur.order_year >= DATE '1993-01-01' AND cur.order_year <= DATE '1997-01-01'

- id: tim019
