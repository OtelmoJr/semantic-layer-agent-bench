- id: tim023
  category: time
  coverage: in
  question: "Which month of 1996 had the highest net revenue?"
  order_matters: true
  reference_sql: |
    SELECT CAST(date_trunc('month', o.o_orderdate) AS DATE) AS order_month,
           SUM(l.l_extendedprice * (1 - l.l_discount)) AS net_revenue
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    WHERE l.l_returnflag <> 'R'
      AND o.o_orderdate >= DATE '1996-01-01' AND o.o_orderdate < DATE '1997-01-01'
    GROUP BY 1
    ORDER BY net_revenue DESC
    LIMIT 1

- id: tim024
  category: time
  coverage: in
  question: "What was yearly gross revenue from customers in GERMANY for 1992 through 1997?"
  order_matters: false
  reference_sql: |
    SELECT CAST(date_trunc('year', o.o_orderdate) AS DATE) AS order_year,
           SUM(l.l_extendedprice) AS gross_revenue
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    JOIN customer c ON c.c_custkey = o.o_custkey
    JOIN nation n ON n.n_nationkey = c.c_nationkey
    WHERE n.n_name = 'GERMANY'
      AND o.o_orderdate >= DATE '1992-01-01' AND o.o_orderdate < DATE '1998-01-01'
    GROUP BY 1

- id: tim025
  category: time
  coverage: in
  question: "Break down the number of orders by quarter and order priority for 1993."
  order_matters: false
  reference_sql: |
    SELECT CAST(date_trunc('quarter', o.o_orderdate) AS DATE) AS order_quarter,
           o.o_orderpriority AS order_priority,
           COUNT(DISTINCT l.l_orderkey) AS order_count
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    WHERE o.o_orderdate >= DATE '1993-01-01' AND o.o_orderdate < DATE '1994-01-01'
    GROUP BY 1, 2
