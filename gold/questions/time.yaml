- id: tim021
  category: time
  coverage: in
  question: "For customers in the ASIA region, what was quarterly year-over-year net revenue growth in 1996 and 1997?"
  order_matters: false
  reference_sql: |
    WITH quarterly AS (
      SELECT CAST(date_trunc('quarter', o.o_orderdate) AS DATE) AS order_quarter,
             SUM(l.l_extendedprice * (1 - l.l_discount)) AS net_revenue
      FROM lineitem l
      JOIN orders o ON o.o_orderkey = l.l_orderkey
      JOIN customer c ON c.c_custkey = o.o_custkey
      JOIN nation n ON n.n_nationkey = c.c_nationkey
      JOIN region r ON r.r_regionkey = n.n_regionkey
      WHERE l.l_returnflag <> 'R'
        AND r.r_name = 'ASIA'
      GROUP BY 1
    )
    SELECT cur.order_quarter,
           (cur.net_revenue - prev.net_revenue) / prev.net_revenue AS net_revenue_yoy_growth
    FROM quarterly cur
    JOIN quarterly prev ON prev.order_quarter = CAST(cur.order_quarter - INTERVAL 1 YEAR AS DATE)
    WHERE cur.order_quarter >= DATE '1996-01-01' AND cur.order_quarter < DATE '1998-01-01'

- id: tim022
  category: time
  coverage: in
  question: "How much did we give away in discounts each month from January through July 1998?"
  order_matters: false
  reference_sql: |
    SELECT CAST(date_trunc('month', o.o_orderdate) AS DATE) AS order_month,
           SUM(l.l_extendedprice * l.l_discount) AS discount_amount
    FROM lineitem l
