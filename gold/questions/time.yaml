- id: tim014
  category: time
  coverage: in
  question: "How many units were ordered per quarter in 1997, split by customer market segment?"
  order_matters: false
  reference_sql: |
    SELECT CAST(date_trunc('quarter', o.o_orderdate) AS DATE) AS order_quarter,
           c.c_mktsegment AS market_segment,
           SUM(l.l_quantity) AS units_ordered
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    JOIN customer c ON c.c_custkey = o.o_custkey
    WHERE o.o_orderdate >= DATE '1997-01-01' AND o.o_orderdate < DATE '1998-01-01'
    GROUP BY 1, 2

