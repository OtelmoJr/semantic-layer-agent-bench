- id: bd024
  category: business_definition
  coverage: in
  question: "What was the average order value in each quarter of 1994?"
  order_matters: false
  reference_sql: |
    SELECT CAST(date_trunc('quarter', o.o_orderdate) AS DATE) AS order_quarter,
           SUM(CASE WHEN l.l_returnflag <> 'R' THEN l.l_extendedprice * (1 - l.l_discount) ELSE 0 END)
             / COUNT(DISTINCT l.l_orderkey) AS average_order_value
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    WHERE o.o_orderdate >= DATE '1994-01-01' AND o.o_orderdate < DATE '1995-01-01'
