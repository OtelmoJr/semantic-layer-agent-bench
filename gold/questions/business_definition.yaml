- id: bd013
  category: business_definition
  coverage: in
  question: "How much did we invoice for orders placed in 1994?"
  order_matters: false
  reference_sql: |
    SELECT SUM(l.l_extendedprice * (1 - l.l_discount) * (1 + l.l_tax)) AS billed_amount
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    WHERE o.o_orderdate >= DATE '1994-01-01' AND o.o_orderdate < DATE '1995-01-01'

