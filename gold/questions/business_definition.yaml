- id: bd022
  category: business_definition
  coverage: in
  question: "Rank the market segments by revenue for Q1 1997 and give me the top 3."
  order_matters: true
  reference_sql: |
    SELECT c.c_mktsegment AS market_segment,
           SUM(l.l_extendedprice * (1 - l.l_discount)) AS net_revenue
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    JOIN customer c ON c.c_custkey = o.o_custkey
    WHERE l.l_returnflag <> 'R'
      AND o.o_orderdate >= DATE '1997-01-01' AND o.o_orderdate < DATE '1997-04-01'
    GROUP BY 1
    ORDER BY net_revenue DESC
    LIMIT 3

