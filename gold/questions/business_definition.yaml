- id: bd018
  category: business_definition
  coverage: in
  question: "For each ship mode, what was the late delivery rate on 1996 orders?"
  order_matters: false
  reference_sql: |
    SELECT l.l_shipmode AS ship_mode,
           AVG(CASE WHEN l.l_receiptdate > l.l_commitdate THEN 1.0 ELSE 0.0 END) AS late_line_rate
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    WHERE o.o_orderdate >= DATE '1996-01-01' AND o.o_orderdate < DATE '1997-01-01'
    GROUP BY 1

- id: bd019
  category: business_definition
  coverage: in
  question: "Which 5 customer nations brought in the most revenue in 1994?"
  order_matters: true
  reference_sql: |
    SELECT n.n_name AS customer_nation,
           SUM(l.l_extendedprice * (1 - l.l_discount)) AS net_revenue
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    JOIN customer c ON c.c_custkey = o.o_custkey
    JOIN nation n ON n.n_nationkey = c.c_nationkey
    WHERE l.l_returnflag <> 'R'
      AND o.o_orderdate >= DATE '1994-01-01' AND o.o_orderdate < DATE '1995-01-01'
    GROUP BY 1
    ORDER BY net_revenue DESC
    LIMIT 5

- id: bd020
