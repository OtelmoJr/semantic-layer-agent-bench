- id: bd001
  category: business_definition
  coverage: in
  question: "What was our revenue in 1994?"
  order_matters: false
  reference_sql: |
    SELECT SUM(l.l_extendedprice * (1 - l.l_discount)) AS net_revenue
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    WHERE l.l_returnflag <> 'R'
      AND o.o_orderdate >= DATE '1994-01-01' AND o.o_orderdate < DATE '1995-01-01'

- id: bd002
  category: business_definition
  coverage: in
  question: "What were total sales for Q4 1995?"
  order_matters: false
  reference_sql: |
    SELECT SUM(l.l_extendedprice * (1 - l.l_discount)) AS net_revenue
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    WHERE l.l_returnflag <> 'R'
      AND o.o_orderdate >= DATE '1995-10-01' AND o.o_orderdate < DATE '1996-01-01'

- id: bd003
  category: business_definition
  coverage: in
  question: "What was the return rate for 1994?"
  order_matters: false
  reference_sql: |
    SELECT SUM(CASE WHEN l.l_returnflag = 'R' THEN l.l_extendedprice * (1 - l.l_discount) ELSE 0 END)
             / SUM(l.l_extendedprice * (1 - l.l_discount)) AS return_rate
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    WHERE o.o_orderdate >= DATE '1994-01-01' AND o.o_orderdate < DATE '1995-01-01'

- id: bd004
  category: business_definition
  coverage: in
  question: "What was our average order value in 1993?"
  order_matters: false
  reference_sql: |
    SELECT SUM(CASE WHEN l.l_returnflag <> 'R' THEN l.l_extendedprice * (1 - l.l_discount) ELSE 0 END)
             / COUNT(DISTINCT l.l_orderkey) AS average_order_value
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    WHERE o.o_orderdate >= DATE '1993-01-01' AND o.o_orderdate < DATE '1994-01-01'

- id: bd005
  category: business_definition
  coverage: in
  question: "What share of order lines from 1995 orders were delivered late?"
  order_matters: false
  reference_sql: |
    SELECT AVG(CASE WHEN l.l_receiptdate > l.l_commitdate THEN 1.0 ELSE 0.0 END) AS late_line_rate
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    WHERE o.o_orderdate >= DATE '1995-01-01' AND o.o_orderdate < DATE '1996-01-01'

- id: bd006
  category: business_definition
  coverage: in
  question: "How much revenue did customers in Europe generate in 1993?"
  order_matters: false
  reference_sql: |
    SELECT SUM(l.l_extendedprice * (1 - l.l_discount)) AS net_revenue
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    JOIN customer c ON c.c_custkey = o.o_custkey
    JOIN nation n ON n.n_nationkey = c.c_nationkey
    JOIN region r ON r.r_regionkey = n.n_regionkey
    WHERE l.l_returnflag <> 'R'
      AND r.r_name = 'EUROPE'
      AND o.o_orderdate >= DATE '1993-01-01' AND o.o_orderdate < DATE '1994-01-01'

