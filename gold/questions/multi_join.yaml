- id: mj001
  category: multi_join
  coverage: in
  question: "Break down net revenue from orders placed in 1996 by customer region and supplier region."
  order_matters: false
  reference_sql: |
    SELECT cr.r_name AS customer_region,
           sr.r_name AS supplier_region,
           SUM(l.l_extendedprice * (1 - l.l_discount)) AS net_revenue
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    JOIN customer c ON c.c_custkey = o.o_custkey
    JOIN nation cn ON cn.n_nationkey = c.c_nationkey
    JOIN region cr ON cr.r_regionkey = cn.n_regionkey
    JOIN supplier s ON s.s_suppkey = l.l_suppkey
    JOIN nation sn ON sn.n_nationkey = s.s_nationkey
    JOIN region sr ON sr.r_regionkey = sn.n_regionkey
    WHERE l.l_returnflag <> 'R'
      AND o.o_orderdate >= DATE '1996-01-01' AND o.o_orderdate < DATE '1997-01-01'
    GROUP BY cr.r_name, sr.r_name

- id: mj002
  category: multi_join
  coverage: in
  question: "How many units did customers in Asia order in 1997, broken down by part manufacturer?"
  order_matters: false
  reference_sql: |
    SELECT p.p_mfgr AS part_manufacturer,
           SUM(l.l_quantity) AS units_ordered
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    JOIN customer c ON c.c_custkey = o.o_custkey
    JOIN nation cn ON cn.n_nationkey = c.c_nationkey
    JOIN region cr ON cr.r_regionkey = cn.n_regionkey
    JOIN part p ON p.p_partkey = l.l_partkey
    WHERE cr.r_name = 'ASIA'
      AND o.o_orderdate >= DATE '1997-01-01' AND o.o_orderdate < DATE '1998-01-01'
    GROUP BY p.p_mfgr

- id: mj003
  category: multi_join
  coverage: in
  question: "For customers located in Europe, how many active customers did we have in 1995 by market segment and customer nation?"
  order_matters: false
  reference_sql: |
    SELECT c.c_mktsegment AS market_segment,
           cn.n_name AS customer_nation,
           COUNT(DISTINCT o.o_custkey) AS active_customers
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    JOIN customer c ON c.c_custkey = o.o_custkey
    JOIN nation cn ON cn.n_nationkey = c.c_nationkey
    JOIN region cr ON cr.r_regionkey = cn.n_regionkey
    WHERE cr.r_name = 'EUROPE'
      AND o.o_orderdate >= DATE '1995-01-01' AND o.o_orderdate < DATE '1996-01-01'
    GROUP BY c.c_mktsegment, cn.n_name

- id: mj004
  category: multi_join
  coverage: in
  question: "Which 10 suppliers generated the most net revenue from Brand#23 parts on orders placed in 1994? List them from highest to lowest."
  order_matters: true
  reference_sql: |
    SELECT s.s_name AS supplier_name,
           SUM(l.l_extendedprice * (1 - l.l_discount)) AS net_revenue
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    JOIN supplier s ON s.s_suppkey = l.l_suppkey
