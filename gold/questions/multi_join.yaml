- id: mj009
  category: multi_join
  coverage: in
  question: "What was the average order value in 1997 for each combination of customer region and market segment?"
  order_matters: false
  reference_sql: |
    SELECT cr.r_name AS customer_region,
           c.c_mktsegment AS market_segment,
           SUM(CASE WHEN l.l_returnflag <> 'R' THEN l.l_extendedprice * (1 - l.l_discount) ELSE 0 END)
             / COUNT(DISTINCT l.l_orderkey) AS average_order_value
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    JOIN customer c ON c.c_custkey = o.o_custkey
    JOIN nation cn ON cn.n_nationkey = c.c_nationkey
    JOIN region cr ON cr.r_regionkey = cn.n_regionkey
    WHERE o.o_orderdate >= DATE '1997-01-01' AND o.o_orderdate < DATE '1998-01-01'
    GROUP BY cr.r_name, c.c_mktsegment

- id: mj010
  category: multi_join
  coverage: in
  question: "How much did we give away in discounts in the first quarter of 1995, by supplier region and ship mode?"
  order_matters: false
  reference_sql: |
    SELECT sr.r_name AS supplier_region,
           l.l_shipmode AS ship_mode,
           SUM(l.l_extendedprice * l.l_discount) AS discount_amount
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    JOIN supplier s ON s.s_suppkey = l.l_suppkey
    JOIN nation sn ON sn.n_nationkey = s.s_nationkey
    JOIN region sr ON sr.r_regionkey = sn.n_regionkey
