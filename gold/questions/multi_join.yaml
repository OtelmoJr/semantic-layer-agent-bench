    GROUP BY sr.r_name, l.l_shipmode

- id: mj011
  category: multi_join
  coverage: in
  question: "Give me the billed amount for customers in Africa by customer nation and order quarter for 1996."
  order_matters: false
  reference_sql: |
    SELECT cn.n_name AS customer_nation,
           CAST(date_trunc('quarter', o.o_orderdate) AS DATE) AS order_quarter,
           SUM(l.l_extendedprice * (1 - l.l_discount) * (1 + l.l_tax)) AS billed_amount
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    JOIN customer c ON c.c_custkey = o.o_custkey
    JOIN nation cn ON cn.n_nationkey = c.c_nationkey
    JOIN region cr ON cr.r_regionkey = cn.n_regionkey
    WHERE cr.r_name = 'AFRICA'
      AND o.o_orderdate >= DATE '1996-01-01' AND o.o_orderdate < DATE '1997-01-01'
    GROUP BY cn.n_name, CAST(date_trunc('quarter', o.o_orderdate) AS DATE)

- id: mj012
  category: multi_join
  coverage: in
  question: "For orders placed in 1997, what was the late line rate for each pair of supplier region and customer region?"
  order_matters: false
  reference_sql: |
    SELECT sr.r_name AS supplier_region,
           cr.r_name AS customer_region,
           AVG(CASE WHEN l.l_receiptdate > l.l_commitdate THEN 1.0 ELSE 0.0 END) AS late_line_rate
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    JOIN customer c ON c.c_custkey = o.o_custkey
    JOIN nation cn ON cn.n_nationkey = c.c_nationkey
    JOIN region cr ON cr.r_regionkey = cn.n_regionkey
    JOIN supplier s ON s.s_suppkey = l.l_suppkey
    JOIN nation sn ON sn.n_nationkey = s.s_nationkey
    JOIN region sr ON sr.r_regionkey = sn.n_regionkey
    WHERE o.o_orderdate >= DATE '1997-01-01' AND o.o_orderdate < DATE '1998-01-01'
    GROUP BY sr.r_name, cr.r_name

