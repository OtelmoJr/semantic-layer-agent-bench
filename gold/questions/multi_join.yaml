    WHERE l.l_returnflag <> 'R'
      AND c.c_mktsegment = 'MACHINERY'
      AND o.o_orderdate >= DATE '1992-01-01' AND o.o_orderdate < DATE '1998-01-01'
    GROUP BY CAST(date_trunc('year', o.o_orderdate) AS DATE), sr.r_name

- id: mj027
  category: multi_join
  coverage: in
  question: "On urgent-priority orders (1-URGENT) placed in 1996, how much discount did we give by customer region and part manufacturer?"
  order_matters: false
  reference_sql: |
    SELECT cr.r_name AS customer_region,
           p.p_mfgr AS part_manufacturer,
           SUM(l.l_extendedprice * l.l_discount) AS discount_amount
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    JOIN customer c ON c.c_custkey = o.o_custkey
    JOIN nation cn ON cn.n_nationkey = c.c_nationkey
    JOIN region cr ON cr.r_regionkey = cn.n_regionkey
    JOIN part p ON p.p_partkey = l.l_partkey
    WHERE o.o_orderpriority = '1-URGENT'
      AND o.o_orderdate >= DATE '1996-01-01' AND o.o_orderdate < DATE '1997-01-01'
    GROUP BY cr.r_name, p.p_mfgr

- id: mj028
  category: multi_join
  coverage: in
  question: "For suppliers located in Africa, what was the late line rate on 1997 orders by supplier nation and ship mode?"
  order_matters: false
  reference_sql: |
    SELECT sn.n_name AS supplier_nation,
           l.l_shipmode AS ship_mode,
           AVG(CASE WHEN l.l_receiptdate > l.l_commitdate THEN 1.0 ELSE 0.0 END) AS late_line_rate
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    JOIN supplier s ON s.s_suppkey = l.l_suppkey
    JOIN nation sn ON sn.n_nationkey = s.s_nationkey
    JOIN region sr ON sr.r_regionkey = sn.n_regionkey
    WHERE sr.r_name = 'AFRICA'
      AND o.o_orderdate >= DATE '1997-01-01' AND o.o_orderdate < DATE '1998-01-01'
    GROUP BY sn.n_name, l.l_shipmode

- id: mj029
  category: multi_join
  coverage: in
  question: "Looking only at order lines for Manufacturer#5 parts supplied by Asian suppliers, which 5 customer nations had the highest average order value in 1995? Rank from highest to lowest."
  order_matters: true
  reference_sql: |
    SELECT cn.n_name AS customer_nation,
           SUM(CASE WHEN l.l_returnflag <> 'R' THEN l.l_extendedprice * (1 - l.l_discount) ELSE 0 END)
             / COUNT(DISTINCT l.l_orderkey) AS average_order_value
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    JOIN customer c ON c.c_custkey = o.o_custkey
    JOIN nation cn ON cn.n_nationkey = c.c_nationkey
    JOIN part p ON p.p_partkey = l.l_partkey
    JOIN supplier s ON s.s_suppkey = l.l_suppkey
    JOIN nation sn ON sn.n_nationkey = s.s_nationkey
    JOIN region sr ON sr.r_regionkey = sn.n_regionkey
    WHERE p.p_mfgr = 'Manufacturer#5'
      AND sr.r_name = 'ASIA'
      AND o.o_orderdate >= DATE '1995-01-01' AND o.o_orderdate < DATE '1996-01-01'
    GROUP BY cn.n_name
    ORDER BY average_order_value DESC
    LIMIT 5

- id: mj030
  category: multi_join
  coverage: in
  question: "For goods supplied by Middle East suppliers on orders placed in 1995, how many order lines were there by line status and customer region?"
  order_matters: false
  reference_sql: |
    SELECT l.l_linestatus AS line_status,
           cr.r_name AS customer_region,
           COUNT(*) AS order_line_count
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    JOIN customer c ON c.c_custkey = o.o_custkey
    JOIN nation cn ON cn.n_nationkey = c.c_nationkey
    JOIN region cr ON cr.r_regionkey = cn.n_regionkey
    JOIN supplier s ON s.s_suppkey = l.l_suppkey
    JOIN nation sn ON sn.n_nationkey = s.s_nationkey
    JOIN region sr ON sr.r_regionkey = sn.n_regionkey
    WHERE sr.r_name = 'MIDDLE EAST'
      AND o.o_orderdate >= DATE '1995-01-01' AND o.o_orderdate < DATE '1996-01-01'
    GROUP BY l.l_linestatus, cr.r_name

- id: mj031
  category: multi_join
  coverage: in
  question: "What was the billed amount for parts shipped in LG BOX containers, by order quarter and customer region, for orders placed in 1994?"
  order_matters: false
  reference_sql: |
    SELECT CAST(date_trunc('quarter', o.o_orderdate) AS DATE) AS order_quarter,
           cr.r_name AS customer_region,
           SUM(l.l_extendedprice * (1 - l.l_discount) * (1 + l.l_tax)) AS billed_amount
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    JOIN customer c ON c.c_custkey = o.o_custkey
    JOIN nation cn ON cn.n_nationkey = c.c_nationkey
    JOIN region cr ON cr.r_regionkey = cn.n_regionkey
    JOIN part p ON p.p_partkey = l.l_partkey
    WHERE p.p_container = 'LG BOX'
      AND o.o_orderdate >= DATE '1994-01-01' AND o.o_orderdate < DATE '1995-01-01'
    GROUP BY CAST(date_trunc('quarter', o.o_orderdate) AS DATE), cr.r_name

- id: mj032
  category: multi_join
  coverage: in
  question: "How many active customers bought from suppliers in each supplier region in 1996, split by the customers' market segment?"
  order_matters: false
  reference_sql: |
    SELECT sr.r_name AS supplier_region,
           c.c_mktsegment AS market_segment,
           COUNT(DISTINCT o.o_custkey) AS active_customers
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    JOIN customer c ON c.c_custkey = o.o_custkey
    JOIN supplier s ON s.s_suppkey = l.l_suppkey
    JOIN nation sn ON sn.n_nationkey = s.s_nationkey
    JOIN region sr ON sr.r_regionkey = sn.n_regionkey
    WHERE o.o_orderdate >= DATE '1996-01-01' AND o.o_orderdate < DATE '1997-01-01'
    GROUP BY sr.r_name, c.c_mktsegment

- id: mj033
  category: multi_join
  coverage: in
  question: "What were the 10 part types with the most net revenue from German customers buying from European suppliers in 1995? Rank them from highest to lowest."
  order_matters: true
  reference_sql: |
    SELECT p.p_type AS part_type,
           SUM(l.l_extendedprice * (1 - l.l_discount)) AS net_revenue
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    JOIN customer c ON c.c_custkey = o.o_custkey
    JOIN nation cn ON cn.n_nationkey = c.c_nationkey
    JOIN supplier s ON s.s_suppkey = l.l_suppkey
    JOIN nation sn ON sn.n_nationkey = s.s_nationkey
    JOIN region sr ON sr.r_regionkey = sn.n_regionkey
    JOIN part p ON p.p_partkey = l.l_partkey
    WHERE l.l_returnflag <> 'R'
      AND cn.n_name = 'GERMANY'
      AND sr.r_name = 'EUROPE'
      AND o.o_orderdate >= DATE '1995-01-01' AND o.o_orderdate < DATE '1996-01-01'
    GROUP BY p.p_type
    ORDER BY net_revenue DESC
    LIMIT 10

- id: mj034
  category: multi_join
  coverage: in
  question: "For Manufacturer#2 parts bought by customers in the America region in 1998, what was the average discount by part brand?"
  order_matters: false
  reference_sql: |
    SELECT p.p_brand AS part_brand,
           AVG(l.l_discount) AS average_discount
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    JOIN customer c ON c.c_custkey = o.o_custkey
    JOIN nation cn ON cn.n_nationkey = c.c_nationkey
    JOIN region cr ON cr.r_regionkey = cn.n_regionkey
    JOIN part p ON p.p_partkey = l.l_partkey
    WHERE p.p_mfgr = 'Manufacturer#2'
      AND cr.r_name = 'AMERICA'
      AND o.o_orderdate >= DATE '1998-01-01' AND o.o_orderdate < DATE '1999-01-01'
    GROUP BY p.p_brand

- id: mj035
  category: multi_join
  coverage: in
  question: "What was 1996 net revenue from Asian customers on goods from Asian suppliers, broken down by customer nation and order priority?"
  order_matters: false
  reference_sql: |
    SELECT cn.n_name AS customer_nation,
           o.o_orderpriority AS order_priority,
           SUM(l.l_extendedprice * (1 - l.l_discount)) AS net_revenue
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    JOIN customer c ON c.c_custkey = o.o_custkey
    JOIN nation cn ON cn.n_nationkey = c.c_nationkey
    JOIN region cr ON cr.r_regionkey = cn.n_regionkey
    JOIN supplier s ON s.s_suppkey = l.l_suppkey
    JOIN nation sn ON sn.n_nationkey = s.s_nationkey
    JOIN region sr ON sr.r_regionkey = sn.n_regionkey
    WHERE l.l_returnflag <> 'R'
      AND cr.r_name = 'ASIA'
      AND sr.r_name = 'ASIA'
      AND o.o_orderdate >= DATE '1996-01-01' AND o.o_orderdate < DATE '1997-01-01'
    GROUP BY cn.n_name, o.o_orderpriority

- id: mj036
  category: multi_join
  coverage: in
  question: "Which 5 supplier nations had the most returned revenue on orders placed in 1993 by customers in Europe? Rank them from highest to lowest."
  order_matters: true
  reference_sql: |
    SELECT sn.n_name AS supplier_nation,
           SUM(l.l_extendedprice * (1 - l.l_discount)) AS returned_revenue
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    JOIN customer c ON c.c_custkey = o.o_custkey
    JOIN nation cn ON cn.n_nationkey = c.c_nationkey
    JOIN region cr ON cr.r_regionkey = cn.n_regionkey
    JOIN supplier s ON s.s_suppkey = l.l_suppkey
    JOIN nation sn ON sn.n_nationkey = s.s_nationkey
    WHERE l.l_returnflag = 'R'
      AND cr.r_name = 'EUROPE'
      AND o.o_orderdate >= DATE '1993-01-01' AND o.o_orderdate < DATE '1994-01-01'
    GROUP BY sn.n_name
    ORDER BY returned_revenue DESC
    LIMIT 5

- id: mj037
  category: multi_join
  coverage: in
  question: "For furniture-segment customers, how many units were ordered in 1994 by return flag and supplier region?"
  order_matters: false
  reference_sql: |
    SELECT l.l_returnflag AS return_flag,
           sr.r_name AS supplier_region,
           SUM(l.l_quantity) AS units_ordered
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    JOIN customer c ON c.c_custkey = o.o_custkey
    JOIN supplier s ON s.s_suppkey = l.l_suppkey
    JOIN nation sn ON sn.n_nationkey = s.s_nationkey
    JOIN region sr ON sr.r_regionkey = sn.n_regionkey
    WHERE c.c_mktsegment = 'FURNITURE'
      AND o.o_orderdate >= DATE '1994-01-01' AND o.o_orderdate < DATE '1995-01-01'
    GROUP BY l.l_returnflag, sr.r_name

- id: mj038
  category: multi_join
  coverage: in
  question: "Show weekly gross revenue for Brand#45 parts bought by customers in India on orders placed in the second quarter of 1996."
  order_matters: false
  reference_sql: |
    SELECT CAST(date_trunc('week', o.o_orderdate) AS DATE) AS order_week,
           SUM(l.l_extendedprice) AS gross_revenue
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    JOIN customer c ON c.c_custkey = o.o_custkey
    JOIN nation cn ON cn.n_nationkey = c.c_nationkey
    JOIN part p ON p.p_partkey = l.l_partkey
    WHERE cn.n_name = 'INDIA'
      AND p.p_brand = 'Brand#45'
      AND o.o_orderdate >= DATE '1996-04-01' AND o.o_orderdate < DATE '1996-07-01'
    GROUP BY CAST(date_trunc('week', o.o_orderdate) AS DATE)

- id: mj039
  category: multi_join
  coverage: in
  question: "How many orders did customers in China and India place in 1997, by customer nation and supplier region?"
  order_matters: false
  reference_sql: |
    SELECT cn.n_name AS customer_nation,
           sr.r_name AS supplier_region,
           COUNT(DISTINCT l.l_orderkey) AS order_count
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    JOIN customer c ON c.c_custkey = o.o_custkey
    JOIN nation cn ON cn.n_nationkey = c.c_nationkey
    JOIN supplier s ON s.s_suppkey = l.l_suppkey
    JOIN nation sn ON sn.n_nationkey = s.s_nationkey
    JOIN region sr ON sr.r_regionkey = sn.n_regionkey
    WHERE cn.n_name IN ('CHINA', 'INDIA')
      AND o.o_orderdate >= DATE '1997-01-01' AND o.o_orderdate < DATE '1998-01-01'
    GROUP BY cn.n_name, sr.r_name

- id: mj040
  category: multi_join
  coverage: in
  question: "Name the 10 suppliers based in Asia that earned the most net revenue from United States customers on orders placed in 1997, from highest to lowest."
  order_matters: true
  reference_sql: |
    SELECT s.s_name AS supplier_name,
           SUM(l.l_extendedprice * (1 - l.l_discount)) AS net_revenue
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    JOIN customer c ON c.c_custkey = o.o_custkey
    JOIN nation cn ON cn.n_nationkey = c.c_nationkey
    JOIN supplier s ON s.s_suppkey = l.l_suppkey
    JOIN nation sn ON sn.n_nationkey = s.s_nationkey
    JOIN region sr ON sr.r_regionkey = sn.n_regionkey
    WHERE l.l_returnflag <> 'R'
      AND cn.n_name = 'UNITED STATES'
      AND sr.r_name = 'ASIA'
      AND o.o_orderdate >= DATE '1997-01-01' AND o.o_orderdate < DATE '1998-01-01'
    GROUP BY s.s_name
    ORDER BY net_revenue DESC
    LIMIT 10
