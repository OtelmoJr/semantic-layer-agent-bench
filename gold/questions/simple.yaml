  reference_sql: |
    SELECT SUM(CASE WHEN l.l_returnflag <> 'R' THEN l.l_extendedprice * (1 - l.l_discount) ELSE 0 END)
           / COUNT(DISTINCT l.l_orderkey) AS average_order_value
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    WHERE o.o_orderdate >= DATE '1997-03-01' AND o.o_orderdate < DATE '1997-04-01'

- id: sim005
  category: simple
  coverage: in
  question: "How much money did we give away in discounts on orders placed in 1992?"
