    JOIN orders o ON o.o_orderkey = l.l_orderkey
    WHERE o.o_orderdate >= DATE '1992-01-01' AND o.o_orderdate < DATE '1993-01-01'

- id: sim006
  category: simple
  coverage: in
  question: "What is the late line rate for orders placed in 1998?"
  order_matters: false
  reference_sql: |
    SELECT AVG(CASE WHEN l.l_receiptdate > l.l_commitdate THEN 1.0 ELSE 0.0 END) AS late_line_rate
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    WHERE o.o_orderdate >= DATE '1998-01-01' AND o.o_orderdate < DATE '1999-01-01'

- id: sim007
  category: simple
  coverage: in
  question: "Which 5 customer nations generated the most net revenue on orders placed in 1996? Rank them from highest to lowest."
  order_matters: true
  reference_sql: |
    SELECT n.n_name AS customer_nation,
           SUM(l.l_extendedprice * (1 - l.l_discount)) AS net_revenue
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    JOIN customer c ON c.c_custkey = o.o_custkey
    JOIN nation n ON n.n_nationkey = c.c_nationkey
    WHERE l.l_returnflag <> 'R'
      AND o.o_orderdate >= DATE '1996-01-01' AND o.o_orderdate < DATE '1997-01-01'
    GROUP BY n.n_name
    ORDER BY net_revenue DESC
    LIMIT 5

- id: sim008
