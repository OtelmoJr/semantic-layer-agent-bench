- id: sim001
  category: simple
  coverage: in
  question: "What was our net revenue for orders placed in 1993?"
  order_matters: false
  reference_sql: |
    SELECT SUM(l.l_extendedprice * (1 - l.l_discount)) AS net_revenue
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    WHERE l.l_returnflag <> 'R'
      AND o.o_orderdate >= DATE '1993-01-01' AND o.o_orderdate < DATE '1994-01-01'

- id: sim002
  category: simple
  coverage: in
  question: "What was the return rate for orders placed in 1994?"
  order_matters: false
  reference_sql: |
    SELECT SUM(CASE WHEN l.l_returnflag = 'R' THEN l.l_extendedprice * (1 - l.l_discount) ELSE 0 END)
           / SUM(l.l_extendedprice * (1 - l.l_discount)) AS return_rate
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    WHERE o.o_orderdate >= DATE '1994-01-01' AND o.o_orderdate < DATE '1995-01-01'

- id: sim003
  category: simple
  coverage: in
  question: "How many active customers did we have in the second quarter of 1996, based on orders placed in that quarter?"
  order_matters: false
  reference_sql: |
    SELECT COUNT(DISTINCT o.o_custkey) AS active_customers
    FROM lineitem l
    JOIN orders o ON o.o_orderkey = l.l_orderkey
    WHERE o.o_orderdate >= DATE '1996-04-01' AND o.o_orderdate < DATE '1996-07-01'

- id: sim004
  category: simple
